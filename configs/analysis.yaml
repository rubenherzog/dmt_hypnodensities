data:
  raw_dir: "/media/rherzoga/T7 Touch/DMTx/Clean"
  output_dir: "outputs"
  electrode_mapping: "configs/egi257_to_1020_mapping.csv"
  # Notebook policy: D1 for placebo; D5 for DMT when available, otherwise highest D-index.
  file_selection_policy: "prefer_d5"

signal:
  sampling_frequency: 500.0
  epoch_duration_seconds: 30.0

segmentation:
  # Context continuity only. Epochs and filters never cross a missing sample.
  gap_tolerance_seconds: 90.0

experimental_windows:
  before: [480.0, 840.0]
  after: [840.0, 2640.0]
  late: [2640.0, 3540.0]

compute:
  # Use CPU explicitly for reproducible local execution.
  device: "cpu"

staging:
  gssc:
    enabled: true
    min_epochs: 1
  yasa:
    enabled: true
    # YASA requires at least two epochs for this analysis.
    # The library's five-minute recommendation is not a technical requirement.
    min_epochs: 2
  sleepfm:
    enabled: true
    min_epochs: 1
    repository: ".external/sleepfm-clinical"
    # Without channel_sets, run the same single-channel analysis as GSSC/YASA.
    # Multichannel inputs can be declared when required by the analysis.
    # channel_sets:
    #   - [E6]
    #   - [E6, E8, Cz]

features:
  spectrum: true
  bandpower: true
  specparam: true
  catch22: true
  yasa_features: true

parallel:
  n_jobs: -1
